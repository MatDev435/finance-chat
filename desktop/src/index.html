<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Chat</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main data-window="main">
    <div class="brand"><img src="icon.png" alt="" width="42" height="42"><h1 id="title" tabindex="-1">Finance Chat</h1></div>
    <p class="status" id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Conectando ao Finance Chat...</p>
    <div class="actions" id="error-actions" hidden>
      <button type="button" id="retry">Tentar de novo</button>
      <button type="button" class="secondary" id="change">Alterar o endereço</button>
    </div>

    <form id="setup" hidden novalidate aria-labelledby="setup-title">
      <h2 id="setup-title">Conectar ao seu Finance Chat</h2>
      <p class="lead">Informe o endereço do Finance Chat que você abre no navegador. O app abre esse mesmo site e acrescenta o registro rápido com Alt+Espaço.</p>
      <div class="field">
        <label for="server-url">Endereço do Finance Chat</label>
        <input id="server-url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://finance.seudominio.com" required aria-describedby="server-hint">
        <p class="hint" id="server-hint">Use HTTPS sempre que possível. Em HTTP, a sessão trafega sem criptografia na rede.</p>
      </div>
      <p class="status" id="setup-status" role="status" aria-live="polite" hidden></p>
      <div class="actions"><button type="submit" id="connect">Conectar</button></div>
    </form>
  </main>
  <script type="module" src="loader.js"></script>
</body>
</html>
