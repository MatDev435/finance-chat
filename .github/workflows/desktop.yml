# Desktop app (Tauri 2).
# - Pull requests touching desktop/: Rust unit tests on Linux.
# - Manual run or a "desktop-v*" tag: Windows installers (.exe and .msi),
#   attached to a DRAFT GitHub release (nothing is published automatically).
name: Desktop app

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  installers:
    name: Windows installers
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Finance Chat para computador v__VERSION__
          releaseBody: Instaladores do app para Windows. Copie-os para DESKTOP_DIR no servidor para oferecê-los em Configurações → App para computador.
          releaseDraft: true
          prerelease: false
