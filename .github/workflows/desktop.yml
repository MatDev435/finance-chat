# Desktop app (Tauri 2).
# - Pull requests touching desktop/: Rust unit tests on Linux.
# - Manual run or a "desktop-v*" tag: installers for Windows, macOS and Linux,
#   attached to a DRAFT GitHub release (nothing is published automatically).
name: Desktop app

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use the bindings shipped with whisper-rs-sys (no libclang needed to build).
  WHISPER_DONT_GENERATE_BINDINGS: '1'

jobs:
  test:
    name: Rust tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  installers:
    name: Installers (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev cmake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Finance Chat para computador v__VERSION__
          releaseBody: Instaladores do app para computador. Copie-os para DESKTOP_DIR no servidor para oferecê-los em Configurações → App para computador.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
